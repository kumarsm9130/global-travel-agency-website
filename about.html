<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Global — Our Story</title>
  <meta name="description" content="Global helps millions travel effortlessly across the globe.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <section class="about-hero">
    <div class="container">
      <h1 class="fade-up">About Global</h1>
      <p class="fade-up d1">We're building the travel platform we always wished existed — beautiful, fast, and honest. Since 2020, we've helped 3M+ travelers explore the world.</p>
    </div>
  </section>

  <section class="container">
    <div class="stats-grid">
      <div class="stat-card fade-up">
        <div style="font-size:32px">👥</div>
        <div class="stat-num">3M+</div>
        <div class="stat-lbl">Happy travelers</div>
      </div>
      <div class="stat-card fade-up d1">
        <div style="font-size:32px">🌍</div>
        <div class="stat-num">500+</div>
        <div class="stat-lbl">Destinations</div>
      </div>
      <div class="stat-card fade-up d2">
        <div style="font-size:32px">🏆</div>
        <div class="stat-num">4.9</div>
        <div class="stat-lbl">Average rating</div>
      </div>
      <div class="stat-card fade-up d3">
        <div style="font-size:32px">✈️</div>
        <div class="stat-num">12K+</div>
        <div class="stat-lbl">Trips booked daily</div>
      </div>
    </div>
  </section>

  <div id="footer"></div>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => mount('about', 'flights'));
  </script>
</body>
</html>
